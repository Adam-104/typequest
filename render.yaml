# Render blueprint for the free backend. See DEPLOY-FREE.md.
services:
  - type: web
    name: typequest-api
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: TYPEQUEST_TRUSTED_PROXY_HOPS
        value: "1"
      - key: JPA_DDL_AUTO
        value: update
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "587"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: TYPEQUEST_JWT_SECRET
        generateValue: true
      - key: TYPEQUEST_ADMIN_EMAIL
        sync: false
      - key: TYPEQUEST_ADMIN_PASSWORD
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: TYPEQUEST_CORS_ALLOWED_ORIGINS
        sync: false
      - key: PASSWORD_RESET_BASE_URL
        sync: false
      - key: EMAIL_VERIFICATION_BASE_URL
        sync: false

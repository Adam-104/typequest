# Application name
spring.application.name=typequest

# MySQL database configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/typequest_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Small pool: free databases allow few connections.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Allowed browser origins (comma-separated)
typequest.cors.allowed-origins=${TYPEQUEST_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Reverse proxies in front of the app (0 = none). Needed so the rate limiter
# sees each player's real IP instead of the proxy's. Count the proxies, e.g.
# 1 on Render/Railway/Heroku, 2 for Cloudflare + a load balancer.
typequest.rate-limit.trusted-proxy-hops=${TYPEQUEST_TRUSTED_PROXY_HOPS:0}

# JWT Secret token
typequest.jwt.secret=${TYPEQUEST_JWT_SECRET}

# Admin Details
typequest.admin.email=${TYPEQUEST_ADMIN_EMAIL:}
typequest.admin.password=${TYPEQUEST_ADMIN_PASSWORD:}

# Brevo SMTP configuration
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# SMTP authentication and TLS
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Connection timeouts
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Password reset email from
typequest.mail.from=${MAIL_FROM}

# Brevo HTTP API key (starts with xkeysib-). When set, mail is sent over HTTPS
# instead of SMTP, which free hosts such as Render block. Leave empty locally.
typequest.mail.brevo-api-key=${BREVO_API_KEY:}

# Frontend password-reset page
typequest.password-reset.base-url=${PASSWORD_RESET_BASE_URL:http://localhost:5173/reset-password}
# Frontend page that confirms an email address (the link in the email)
typequest.email-verification.base-url=${EMAIL_VERIFICATION_BASE_URL:http://localhost:5173/verify-email}

# Health check for hosting platforms and Docker: only /actuator/health is
# exposed and it reports UP or DOWN without details. The mail server is left
# out so a mail outage does not make the whole app look dead.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false

# Production behaviour
# Hosts such as Render tell the app which port to use through PORT.
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.compression.enabled=true
# Error responses never include Java exception text or stack traces.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

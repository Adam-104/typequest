# Application name
spring.application.name=typequest

# MySQL database configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/typequest_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT Secret token
typequest.jwt.secret=${TYPEQUEST_JWT_SECRET}

# Admin Details
typequest.admin.email=${TYPEQUEST_ADMIN_EMAIL:}
typequest.admin.password=${TYPEQUEST_ADMIN_PASSWORD:}

# Brevo SMTP configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# SMTP authentication and TLS
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Connection timeouts
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Password reset email from
typequest.mail.from=${MAIL_FROM}

# Frontend password-reset page
typequest.password-reset.base-url=${PASSWORD_RESET_BASE_URL:http://localhost:5173/reset-password}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TypeQuest – Learn to type, play to win</title>
    <meta name="description" content="Level up your typing speed with lessons, games, XP and leaderboards." />
    <meta name="theme-color" content="#efe6d0" />

    <!-- Link previews (WhatsApp, LinkedIn, X, Slack...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TypeQuest" />
    <meta property="og:title" content="TypeQuest – Learn to type, play to win" />
    <meta property="og:description" content="Learn touch typing in 26 lessons, play 5 typing games, earn XP and climb the leaderboard. Free." />
    <meta property="og:url" content="https://typequest-adam.vercel.app/" />
    <meta property="og:image" content="https://typequest-adam.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TypeQuest: learn to type, play to win" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TypeQuest – Learn to type, play to win" />
    <meta name="twitter:description" content="Learn touch typing in 26 lessons, play 5 typing games, earn XP and climb the leaderboard. Free." />
    <meta name="twitter:image" content="https://typequest-adam.vercel.app/og-image.png" />
    <script>
      // Apply the saved theme before the first paint so there is no flash.
      (function () {
        try {
          var pref = localStorage.getItem('typequest-theme') || 'system';
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#171310' : '#efe6d0');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
